[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "leaf_gm_architecture"
version = "0.1.0"
description = "A Python package for analyzing plant functional types and traits."
authors = ["Milad Rahimi Majd <milad.rahimi.majd@uni-potsdam.de>"]
maintainers = ["Arne Neumann <leaf_gm_architecture.programming@arne.cl>"]

[tool.poetry.dependencies]
python = ">=3.11,<3.12"
pandas = "1.5.3"
numpy = "1.24.3"
scikit-learn = "1.2.2"
scipy = "1.10.1"
openpyxl = "3.0.7"
 streamlit = "1.65.0"
streamlit_option_menu = "0.3.12"
# pyarrow 15+ doesn't work with the pinned numpy 1.24.3 anymore
# (pandas needs it as the parquet engine for the aggregated dataset)
pyarrow = ">=7.0,<15"
pytest = "^8.0"
pytest-cov = "^7.0"

[tool.poetry.extras]
dev = []

[tool.pytest.ini_options]
# every test run must report 100 % line and branch coverage
# for the web app package (src/leaf_gm_architecture), so that a dropped
# test or a new untested line fails the test suite. The folder is given
# as a path (not as a package name) because Streamlit's test browser
# executes streamlit_app.py as a script ("__main__"), which coverage
# cannot attribute to the package name.
addopts = "--cov=src/leaf_gm_architecture --cov-report=term-missing --cov-fail-under=100"
# any warning that is not explicitly ignored (see the test that records
# the ensemble-size-1 NaN columns) fails the suite, so that the library
# update in ticket 0002 surfaces new warnings immediately
filterwarnings = ["error"]

[tool.coverage.run]
branch = true  # measure if/else decisions in both directions

[tool.coverage.report]
show_missing = true
# show line numbers of missed lines/branches in the report
