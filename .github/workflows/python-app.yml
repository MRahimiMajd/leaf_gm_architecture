# This workflow will install Python dependencies and run tests with a single version of Python.
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: leaf_gm_architecture

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.11
      uses: actions/setup-python@v3
      with:
        python-version: "3.11"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # editable install, so that the tests measure coverage of the
        # sources in src/ (a regular install would copy the package into
        # site-packages, where the coverage gate cannot see it).
        # The "dev" extra adds playwright, the driver of the
        # real-browser menu test.
        pip install -e ".[dev]"
    - name: Install headless Chromium for the browser menu test
      run: playwright install --with-deps chromium
    - name: Test with pytest
      run: |
        pytest
